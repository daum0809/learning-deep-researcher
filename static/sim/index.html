<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>배움 세계여행</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --sky-top:#141a3a; --sky-mid:#3b2f6b; --sky-bot:#c98bb9;
  --glass:rgba(255,255,255,.10); --glass-2:rgba(255,255,255,.16); --line:rgba(255,255,255,.22);
  --ink:#fdf8ff; --ink-2:#d9d2f0; --ink-3:#a99fcf;
  --gold:#ffd27a; --coral:#ff7a90; --mint:#7ee8a8; --sky:#4fc3f7; --red:#ff6b6b;
  --radius:18px; --shadow:0 18px 50px rgba(10,6,40,.45);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;color:var(--ink);font-family:"Gowun Dodum",system-ui,sans-serif;
  background:radial-gradient(120% 90% at 50% 110%, var(--sky-bot) 0%, var(--sky-mid) 42%, var(--sky-top) 78%);}
h1,h2,h3,.jua{font-family:"Jua","Gowun Dodum",sans-serif;font-weight:400;letter-spacing:.2px}
button,select,input,textarea{font-family:inherit;color:inherit}
#stage{position:fixed;inset:0}
#labels{position:fixed;inset:0;pointer-events:none}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:var(--radius);
  backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);box-shadow:var(--shadow)}

/* ── 위쪽 띠 ── */
#top{position:fixed;left:16px;right:16px;top:14px;display:flex;gap:12px;align-items:center;z-index:5}
#brand{display:flex;align-items:center;gap:10px;padding:10px 16px}
#brand .logo{font-size:26px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.35))}
#brand h1{margin:0;font-size:22px;line-height:1}
#brand small{display:block;color:var(--ink-3);font-size:12px;margin-top:3px}
#badges{display:flex;gap:8px;flex-wrap:wrap;flex:1;max-width:calc(50vw - 160px)}
.pill{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:999px;font-size:13.5px;
  background:var(--glass-2);border:1px solid var(--line);white-space:nowrap}
.pill b{font-family:Jua;font-weight:400}
.pill.live{background:rgba(255,107,107,.22);border-color:rgba(255,140,140,.6)}
.pill.replay{background:rgba(126,232,168,.18);border-color:rgba(126,232,168,.55)}
.pill.view{background:rgba(79,195,247,.16);border-color:rgba(79,195,247,.5)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 0 0 rgba(255,107,107,.7);animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,107,107,.7)}70%{box-shadow:0 0 0 10px rgba(255,107,107,0)}100%{box-shadow:0 0 0 0 rgba(255,107,107,0)}}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--glass-2);border-radius:12px;padding:9px 14px;font-size:14px;transition:.15s}
.btn:hover{background:rgba(255,255,255,.26);transform:translateY(-1px)}
.btn.primary{background:linear-gradient(135deg,#ff9a8b,#ff6a88 55%,#ff99ac);border-color:transparent;font-family:Jua;font-size:16px;
  box-shadow:0 8px 22px rgba(255,106,136,.45)}
.btn.primary:disabled{filter:grayscale(.7);opacity:.6;cursor:not-allowed;transform:none}

/* ── 여행 계획 서랍 ── */
#planner{position:fixed;top:84px;left:16px;width:340px;padding:16px;z-index:6;display:none}
#planner.open{display:block}
#planner h3{margin:0 0 10px;font-size:18px}
.field{margin:10px 0}
.field label{display:block;font-size:12.5px;color:var(--ink-2);margin-bottom:5px}
.field textarea,.field input[type=number],.field select{width:100%;background:rgba(10,8,40,.35);border:1px solid var(--line);
  border-radius:10px;padding:9px 10px;font-size:14px;outline:none}
.field textarea{height:64px;resize:vertical}
.row{display:flex;gap:10px}.row>*{flex:1}
.toggles{display:grid;grid-template-columns:1fr;gap:6px}
.toggle{display:flex;gap:8px;align-items:center;font-size:13.5px;padding:7px 9px;border-radius:10px;background:rgba(10,8,40,.25);cursor:pointer}
.toggle input{accent-color:#ff7a90}
.hint{font-size:12px;color:var(--ink-3);line-height:1.5}
.warn{font-size:12.5px;color:#ffe2a8;background:rgba(255,200,90,.12);border:1px solid rgba(255,200,90,.35);padding:8px 10px;border-radius:10px;margin-top:8px}

/* ── 왼쪽: 여행자 일정표 ── */
#itin{position:fixed;left:16px;top:84px;bottom:150px;width:300px;padding:14px;z-index:4;overflow:auto}
#itin h3{margin:2px 0 4px;font-size:18px}
#itin .q{font-size:13px;color:var(--ink-2);margin-bottom:10px;line-height:1.5}
.tcard{border-radius:14px;padding:11px 12px;margin:9px 0;background:rgba(10,8,40,.28);border:1px solid rgba(255,255,255,.12);cursor:pointer;transition:.15s;position:relative;overflow:hidden}
.tcard:hover{background:rgba(10,8,40,.4)}
.tcard.sel{outline:2px solid var(--c);outline-offset:-2px}
.tcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.tcard .hd{display:flex;align-items:center;gap:8px}
.tcard .av{width:28px;height:28px;border-radius:50%;background:var(--c);display:grid;place-items:center;font-family:Jua;color:#2a1d4a;font-size:15px;flex:none}
.tcard .ti{font-family:Jua;font-size:15px;line-height:1.2}
.tcard .ro{font-size:12px;color:var(--ink-3)}
.tcard .st{margin-left:auto;font-size:12px;padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.12);white-space:nowrap}
.stamps{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.stamp{font-size:11.5px;padding:3px 7px;border-radius:7px;border:1.5px dashed var(--c);color:var(--ink);background:rgba(255,255,255,.06)}
.stamp.seed{border-style:solid}
.stamp.now{background:var(--c);color:#24183f}
.meter{height:6px;border-radius:6px;background:rgba(255,255,255,.12);margin-top:8px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--c);border-radius:6px}
.coord{--c:var(--gold)}

/* ── 오른쪽 패널 ── */
#side{position:fixed;right:16px;top:84px;bottom:150px;width:420px;z-index:4;display:flex;flex-direction:column;overflow:hidden}
#tabs{display:flex;gap:4px;padding:8px 8px 0}
.tab{flex:1;cursor:pointer;border:none;background:transparent;padding:9px 2px;border-radius:12px 12px 0 0;font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.tab.on{background:rgba(255,255,255,.14);color:var(--ink);font-family:Jua;font-size:13.5px}
#pane{flex:1;overflow:auto;padding:14px 16px;background:rgba(255,255,255,.06);border-top:1px solid var(--line)}
.kv{display:grid;grid-template-columns:96px 1fr;gap:6px 10px;font-size:13.5px;margin:6px 0 12px}
.kv dt{color:var(--ink-3)}.kv dd{margin:0;word-break:break-all}
.box{background:rgba(10,8,40,.35);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.65;white-space:pre-wrap;word-break:break-word;max-height:300px;overflow:auto}
.sec-chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:12.5px;background:var(--c);color:#24183f;font-family:Jua}
.evhead{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.evhead .big{font-size:30px}
.evhead h2{margin:0;font-size:19px;line-height:1.3}
.cite{cursor:pointer;border:none;background:rgba(255,210,122,.22);color:#ffe7b0;border-radius:6px;padding:0 4px;font-size:inherit}
.cite.bad{background:rgba(255,107,107,.3);color:#ffd0d0;text-decoration:line-through}
.report h1{font-size:22px;margin:4px 0 10px}.report h2{font-size:17px;margin:18px 0 6px;color:#ffe2f0}
.report p{line-height:1.8;font-size:14px;margin:6px 0}
.bar{display:grid;grid-template-columns:120px 1fr 92px;gap:8px;align-items:center;font-size:12.5px;margin:6px 0}
.bar .tr{height:10px;border-radius:6px;background:rgba(255,255,255,.1);position:relative;overflow:hidden}
.bar .tr i{position:absolute;left:0;top:0;bottom:0;background:var(--c);border-radius:6px}
.bar .num{text-align:right;color:var(--ink-2)}
table.toc{width:100%;border-collapse:collapse;font-size:13px}
table.toc td,table.toc th{padding:6px 5px;border-bottom:1px solid rgba(255,255,255,.1);text-align:left;vertical-align:top}
table.toc th{color:var(--ink-3);font-weight:400}
.empty{color:var(--ink-3);text-align:center;padding:30px 10px;line-height:1.7}
.logline{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;white-space:pre-wrap;margin:3px 0;color:var(--ink-2)}
details{margin:6px 0}summary{cursor:pointer;color:var(--ink-2);font-size:13px}

/* ── 아래: 디버거 ── */
#dock{position:fixed;left:16px;right:16px;bottom:14px;height:122px;padding:12px 16px;z-index:5;display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center}
#transport{display:flex;gap:6px;align-items:center}
.tbtn{width:42px;height:42px;border-radius:13px;border:1px solid var(--line);background:var(--glass-2);cursor:pointer;font-size:17px;display:grid;place-items:center;transition:.12s}
.tbtn:hover{background:rgba(255,255,255,.28)}
.tbtn.play{width:54px;height:54px;border-radius:50%;font-size:22px;background:linear-gradient(135deg,#ffd27a,#ff9f6e);border:none;color:#3a1f2a;box-shadow:0 8px 20px rgba(255,170,100,.4)}
#tl{display:flex;flex-direction:column;gap:6px;min-width:0}
#caption{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#caption .ix{font-family:Jua;color:var(--gold);margin-right:8px}
#ticks{height:22px;width:100%;cursor:pointer;border-radius:6px;background:rgba(10,8,40,.3)}
#scrub{width:100%;accent-color:#ffd27a;margin:0}
#bps{display:flex;gap:5px;flex-wrap:wrap;align-items:center;max-width:430px;justify-content:flex-end}
#bps .lab{font-size:12px;color:var(--ink-3);width:100%;text-align:right}
.bp{font-size:12px;padding:5px 9px;border-radius:999px;border:1px solid var(--line);background:transparent;cursor:pointer}
.bp.on{background:rgba(255,107,107,.3);border-color:rgba(255,130,130,.8)}
.bp.on::before{content:"● ";color:#ff6b6b}
#cam{background:rgba(20,14,50,.55);padding:9px 10px;max-width:240px;flex:none}
#cam option,#speed option,select option{background:#2b2350;color:#fff}
.metric{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:11px 12px;border-radius:12px;background:rgba(10,8,40,.3);border:1px solid rgba(255,255,255,.12);margin:8px 0}
.metric .v{font-family:Jua;font-size:24px;text-align:right}
.metric .n{font-family:Jua;font-size:15px}
.metric .d{grid-column:1/-1;font-size:12.5px;color:var(--ink-3);line-height:1.55}
.metric.alarm-ok{border-color:rgba(126,232,168,.5)}.metric.alarm-bad{border-color:rgba(255,107,107,.8);background:rgba(255,107,107,.15)}
#speed{background:rgba(10,8,40,.35);border:1px solid var(--line);border-radius:10px;padding:6px 8px}
kbd{font-family:ui-monospace,Consolas,monospace;font-size:11px;padding:1px 5px;border-radius:5px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.2)}

/* ── 3D 위 라벨 ── */
.city-label{font-size:11.5px;padding:2px 7px;border-radius:999px;background:rgba(20,14,50,.55);border:1px solid rgba(255,255,255,.18);white-space:nowrap;
  transform:translateY(-14px);transition:opacity .2s, background .2s;pointer-events:auto;cursor:pointer}
.city-label.hot{background:rgba(255,210,122,.85);color:#3a2410;font-family:Jua;font-size:12.5px}
.city-label.avoid{background:rgba(255,107,107,.75);color:#fff}
.city-label.avoid::before{content:"🚩 "}
.city-label.visited{border-color:var(--c);border-width:2px}
.city-label.reading{background:var(--c);color:#24183f;font-family:Jua;font-size:13px}
.trav-label{display:flex;flex-direction:column;align-items:center;gap:3px;transform:translateY(-22px)}
.trav-label .nm{font-family:Jua;font-size:12.5px;padding:2px 8px;border-radius:999px;background:var(--c);color:#24183f;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.trav-label .bub{font-size:12px;padding:4px 9px;border-radius:12px;background:rgba(255,255,255,.92);color:#2b2350;white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}
.trav-label .bub:empty{display:none}
.hq-label{display:flex;flex-direction:column;align-items:center;gap:4px;transform:translateY(-30px)}
.hq-label .nm{font-family:Jua;font-size:14px;padding:4px 11px;border-radius:999px;background:var(--gold);color:#3a2410;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.hq-label .bub{font-size:12.5px;padding:5px 10px;border-radius:12px;background:rgba(255,255,255,.94);color:#2b2350;white-space:nowrap}

/* ── 문서 미리보기 ── */
#modal{position:fixed;inset:0;background:rgba(8,5,30,.55);display:none;place-items:center;z-index:20}
#modal.open{display:grid}
#modal .card{width:min(680px,92vw);max-height:80vh;overflow:auto;padding:20px 22px}
#modal h2{margin:0 0 4px}
#toast{position:fixed;left:50%;top:84px;transform:translateX(-50%);z-index:30;padding:10px 16px;display:none}
@media (max-width:1100px){#itin{display:none}#side{width:min(420px,calc(100vw - 32px))}}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<div id="stage"></div>
<div id="labels"></div>

<header id="top">
  <div id="brand" class="glass"><span class="logo">🎓</span><div><h1>배움 세계여행</h1><small id="brandSub">딥리서처를 여행으로 지켜보기</small></div></div>
  <div id="badges"></div>
  <select id="cam" class="btn" title="🎥 시점"><option value="free">🎥 자유 시점</option><option value="auto">🎬 자동 — 지금 주인공 따라가기</option><option value="hq">🧭 본사</option></select>
  <button class="btn" id="openPlanner">⏪ 다른 여행 고르기</button>
</header>

<section id="planner" class="glass">
  <div hidden>
  <div class="field"><label>질문 세트에서 고르기</label><select id="fPreset"></select></div>
  <div class="field"><label>질문 — 여행의 목적</label><textarea id="fQuestion"></textarea><div class="hint" id="fWhy"></div></div>
  <div class="row">
    <div class="field"><label>여행자 수 (절 수)</label><input id="fSections" type="number" min="1" max="8" value="4"></div>
    <div class="field"><label>도시 예산 (절 예산)</label><input id="fBudget" type="number" min="1" max="8" value="3"></div>
  </div>
  <div class="toggles">
    <label class="toggle"><input type="checkbox" id="fNoRoles"> 역할 끔 — 모두 같은 범용 여행자</label>
    <label class="toggle"><input type="checkbox" id="fNoAssign"> 배정 끔 — 첫 도시를 정해 주지 않음</label>
    <label class="toggle"><input type="checkbox" id="fNoZones"> 구역 끔 — 남의 도시에도 착륙 허용</label>
  </div>
  <div class="row">
    <div class="field"><label>실행 모드</label><select id="fMode"><option value="auto">자동 (키 있으면 실제 호출)</option><option value="replay">저장된 기록 재생</option></select></div>
    <div class="field"><label>재생 속도 (호출당 초)</label><input id="fPace" type="number" step="0.1" min="0" max="5" value="0.7"></div>
  </div>
  <div class="field"><label>🌩️ 결항 시나리오 (재생 모드 전용)</label><select id="fIncident"><option value="">없음</option></select></div>
  <div id="planWarn"></div>
  <div class="row" style="margin-top:12px">
    <button class="btn primary" id="go">✈️ 출발!</button>
  </div>
  </div>
  <h3>⏪ 저장된 여행 다시보기</h3>
  <div class="hint" style="margin-bottom:8px">output/runs.jsonl 에 저장된 실행을 3D 여행으로 다시 그립니다. 모델을 부르지 않아요. 👥 다중 에이전트 · 👤 단일 대조군</div>
  <div class="field"><select id="fRuns"></select></div>
  <button class="btn" id="loadRun" style="width:100%">불러오기</button>
</section>

<aside id="itin" class="glass"></aside>

<aside id="side" class="glass">
  <nav id="tabs">
    <button class="tab on" data-tab="event">🔍 이벤트</button>
    <button class="tab" data-tab="vars">🧮 변수</button>
    <button class="tab" data-tab="report">📘 가이드북</button>
    <button class="tab" data-tab="score">📊 결산</button>
    <button class="tab" data-tab="log">📜 로그</button>
  </nav>
  <div id="pane"></div>
</aside>

<footer id="dock" class="glass">
  <div id="transport">
    <button class="tbtn" id="bFirst" title="처음 (Home)">⏮</button>
    <button class="tbtn" id="bPrev" title="한 단계 뒤로 (← / Shift+F10)">◀</button>
    <button class="tbtn play" id="bPlay" title="재생/일시정지 (Space)">▶</button>
    <button class="tbtn" id="bNext" title="한 단계 앞으로 (→ / F10)">▶|</button>
    <button class="tbtn" id="bCont" title="다음 중단점까지 (F5)">⏭</button>
    <select id="speed" title="재생 배속"><option>0.5</option><option selected>1</option><option>2</option><option>4</option><option>8</option></select>
  </div>
  <div id="tl">
    <div id="caption"><span class="ix">— / —</span>저장된 여행을 불러오는 중…</div>
    <canvas id="ticks"></canvas>
    <input type="range" id="scrub" min="-1" max="-1" value="-1">
  </div>
  <div id="bps"></div>
</footer>

<div id="modal"><div class="card glass" id="modalCard"></div></div>
<div id="toast" class="glass"></div>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { CSS2DRenderer, CSS2DObject } from "three/addons/renderers/CSS2DRenderer.js";

/* ───────────────────────── 공통 ───────────────────────── */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = (n) => Number(n || 0).toLocaleString("ko-KR");
const COLORS = ["#ff7a90","#4fc3f7","#ffd166","#7ee8a8","#b69cff","#ff9f6e","#5eead4","#f9a8d4"];
const GOLD = "#ffd27a";
let WINDOW_CHARS = 256000, WINDOW_NOTE = "128K 토큰 × 2자";  // 서버가 모델·자료에 맞춰 다시 알려 준다
const colorOf = (sec) => sec == null ? GOLD : COLORS[sec % COLORS.length];
const STEP_LABEL = {plan:"일정표 짜기", read:"취재", pick:"행선지 고르기", write:"엽서 쓰기", edit:"가이드북 제본"};
function toast(msg, ms = 2600){ const t = $("#toast"); t.textContent = msg; t.style.display = "block"; clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = "none", ms); }
const shortName = (t) => { const m = String(t || "").match(/^(.{2,40}?\(\d{4}\))\s/); return m ? `📄 ${m[1]}` : t; };   // 논문은 저자 (연도)만
function parseObj(raw){ try { const m = String(raw).match(/\{[\s\S]*\}/); return m ? JSON.parse(m[0]) : {}; } catch { return {}; } }

/* ───────────────────────── 3D 무대 ───────────────────────── */
const R = 10;
const stage = $("#stage");
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);

function layoutSphere(titles, links){
  // 링크로 이어진 문서끼리 가깝게 — 구면 위 힘 배치. 북극(본사) 주변은 비워 둔다

  const F = P.map(() => new THREE.Vector3()), d = new THREE.Vector3();
  for (let it = 0; it < 420; it++) {
    F.forEach((f) => f.set(0, 0, 0));
    for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) { d.subVectors(P[i], P[j]); const l2 = Math.max(d.lengthSq(), 1e-3); d.multiplyScalar(0.012 / l2); F[i].add(d); F[j].sub(d); }
    for (const [a, b] of edges) { d.subVectors(P[b], P[a]).multiplyScalar(0.006); F[a].add(d); F[b].sub(d); }
    const cool = 1 - it / 460;
    for (let i = 0; i < n; i++) { P[i].addScaledVector(F[i], cool).normalize(); if (P[i].y > 0.74) { P[i].y = 0.74; P[i].normalize(); } if (P[i].y < -0.8) { P[i].y = -0.8; P[i].normalize(); } }
  }

}

function arcPoints(d1, d2, lift, n){
  const out = [], ang = d1.angleTo(d2), q1 = new THREE.Quaternion(), q = new THREE.Quaternion().setFromUnitVectors(d1, d2);

  const from = t.g.position.clone(), d1 = from.clone().normalize(), d2 = dest.clone().normalize();

  const qi = new THREE.Quaternion().slerp(q, e);

  const r = f.r1 + (f.r2 - f.r1) * e + Math.sin(Math.PI * e) * (1.2 + f.ang * 2.4);
  const next = dir.multiplyScalar(r);
  if (f.ang < 1e-4) next.lerpVectors(f.from, f.dest, e).add(new THREE.Vector3(0, Math.sin(Math.PI * e) * .8, 0));

  x.fillStyle = "#fffaf2"; x.fillRect(0, 0, 256, 176);
  x.strokeStyle = colorOf(sec); x.lineWidth = 12; x.strokeRect(6, 6, 244, 164);
  x.fillStyle = colorOf(sec); x.fillRect(190, 18, 46, 54);
  x.fillStyle = "#3a2d5c"; x.font = "bold 30px Jua, sans-serif"; x.fillText(`✉ 절 ${sec + 1}`, 22, 52);
  x.font = "22px 'Gowun Dodum', sans-serif"; x.fillText(`${fmt(chars)}자`, 22, 100); x.fillText(`인용 ${cites}곳`, 22, 134);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; return tex;

function ensurePostcard(sec, total, from, chars, cites, instant){
  if (postcards.has(sec)) return;
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(0.9, 0.62), new THREE.MeshBasicMaterial({ map: cardTexture(sec, chars, cites), side: THREE.DoubleSide, transparent: true }));
  const a = (sec / Math.max(total, 1)) * Math.PI * 2, dest = new THREE.Vector3(Math.cos(a) * 1.25, HQ_BASE + 3.9 + sec * 0.05, Math.sin(a) * 1.25);
  mesh.position.copy(instant ? dest : from); scene.add(mesh);
  postcards.set(sec, { mesh, from: from.clone(), dest, t: instant ? 1 : 0, dur: 1.6 / playSpeed() });

function clearPostcards(){ postcards.forEach((p) => scene.remove(p.mesh)); postcards.clear(); }

/* ───────────────────────── 상태: 이벤트 0..i 를 접어서 만든다 ───────────────────────── */
function derive(events, idx){
  const S = { mode: null, run: null, phase: "idle", question: "", settings: null, plan: null, tasks: [], T: {},
    coord: { chars: 0, calls: 0, status: "출발 준비 중" }, report: "", log: [], error: null, done: false };
  const T = (sec) => S.T[sec];
  for (let i = 0; i <= idx && i < events.length; i++) {
    const e = events[i];
    switch (e.kind) {
      case "run_start": if (e.window_chars) { WINDOW_CHARS = e.window_chars; WINDOW_NOTE = e.window_note; } Object.assign(S, { mode: e.mode, run: e, question: e.question, settings: e.settings, phase: "plan" }); S.coord.status = "일정표 짜는 중… 📋"; break;
      case "node_start":
        if (e.node === "plan") S.coord.status = `문서 카드 ${fmt(e.cards_chars)}자로 일정 짜는 중`;
        if (e.node === "researcher" && T(e.section)) T(e.section).status = "출발 ✈️";
        if (e.node === "synthesize") { S.phase = "synth"; S.coord.status = "엽서를 모아 가이드북 제본 중 📘"; }
        break;
      case "node_end":
        if (e.node === "plan") { S.plan = e.plan; S.coord.status = `일정표 완성 — ${e.plan.목차.length}개 구역`; S.log.push(...(e.log || [])); }
        if (e.node === "researcher" && T(e.section)) {
          const t = T(e.section), self = e.result.충분 === false ? ` · 부족 신고: ${(e.result.부족 || "").slice(0, 40)}` : e.result.충분 ? " · 충분" : "";
          if ((e.round || 1) > 1 && t.draft) { t.draft2 = e.result; t.status = `${e.round}바퀴 엽서 도착 — 본사 점검 대기${self}`; }
          else Object.assign(t, { draft: e.result.본문, cites: e.result.인용, read: e.result.읽은문서, done: true, status: `엽서 발송 완료 ✉️${self}` });
          S.log.push(...(e.log || []));
        }
        if (e.node === "synthesize") { S.report = e.report; S.log.push(...(e.log || [])); S.coord.status = "가이드북 완성! 🎉"; }
        break;
      case "dispatch":
        S.phase = "research";
        if ((e.round || 1) > 1) {
          for (const task of e.tasks) if (S.T[task.번호]) Object.assign(S.T[task.번호], { task, avoid: task.피하기 || [], round: e.round, status: `${e.round}바퀴 재출발 🔁 (남의 구역 ${(task.피하기 || []).length}곳 피함)` });
          S.coord.status = `부족 신고한 ${e.tasks.length}절만 다시 보냄 🔁`;
          break;
        }
        S.tasks = e.tasks;
        for (const task of e.tasks) S.T[task.번호] = { sec: task.번호, task, status: "대기", at: null, visited: [], picks: [], candidates: [], avoid: task.피하기 || [], chars: 0, calls: 0, raw: 0, notes: 0, draft: null, cites: [], done: false, error: null };
        S.coord.status = `여행자 ${e.tasks.length}명 동시 출발! 🛫`;
        break;
      case "call_start":
        if (e.section == null) { S.coord.chars += e.sent_chars; S.coord.calls++; }
        else if (T(e.section)) {
          const t = T(e.section); t.chars += e.sent_chars; t.calls++;
          if (e.step === "read") { t.at = e.doc; t.status = `«${e.doc}» 취재 중 📖`; t.raw += e.user_chars; t.reading = e.doc; }
          if (e.step === "pick") { t.status = e.candidates.length ? `다음 행선지 고민 중 🤔 (후보 ${e.candidates.length}곳)` : "다음 행선지 고르는 중 🤔"; t.candidates = e.candidates; }
          if (e.step === "write") { t.status = "엽서 쓰는 중 ✍️"; t.reading = null; }
        }
        break;
      case "call_end":
        if (e.section != null && T(e.section)) {
          const t = T(e.section);
          if (e.step === "read") { t.visited.push({ doc: e.doc, note: e.reply }); t.notes += e.reply_chars; t.status = `«${e.doc}» 메모 ${fmt(e.reply_chars)}자 📝`; t.reading = null; }
          if (e.step === "pick") { const pick = parseObj(e.reply)["문서"] || null; t.picks.push({ candidates: t.candidates, pick }); t.candidates = []; t.status = pick ? `다음 행선지 «${pick}» ✈️` : "더 갈 곳 없음 — 귀환 준비"; }
        }
        break;
      case "call_error": case "node_error":
        if (e.section != null && T(e.section)) { T(e.section).error = e.error; T(e.section).status = "결항! ⛈️"; }
        break;
      case "review": S.coord.status = e.gaps.length ? `④ 점검: 부족 ${e.gaps.length}절 → 재위임` : "④ 점검: 다시 보낼 절 없음"; S.log.push(...(e.log || [])); break;
      case "decision":
        if (T(e.section)) {
          const t = T(e.section);
          if (e.accepted && t.draft2) Object.assign(t, { draft: t.draft2.본문, cites: t.draft2.인용, read: t.draft2.읽은문서 });
          t.status = e.accepted ? `${e.round}바퀴 원고 받음 ✅ ${e.reason}` : `${e.round}바퀴 원고 버림 ✋ ${e.reason} — 첫 원고 유지`;
        }
        break;
      case "metrics": S.recorded = e.metrics; break;
      case "run_end": S.done = true; S.phase = "done"; S.report = e.report; S.log = e.log; break;
      case "run_error": S.error = e.error; S.phase = "error"; S.coord.status = "여행 중단 ⛈️"; break;
    }
  }
  return S;
}

function tick(){

/* 정답표·판정 모델 없이 코드로 세는 지표 — 만들어진 글과 실제로 읽은 문서만 본다 */
function sentencesOf(text){
  // 리서처는 «인용»을 마침표 뒤에 붙인다. 그대로 자르면 인용이 다음 문장 몫이 되므로, 앞 문장 안으로 옮긴 뒤 자른다

  return moved.split(/(?<=[.!?])\s+|\n/).map((x) => x.trim()).filter((x) => x.length > 15 && !x.startsWith("#"));
}
function computeMetrics(){
  const drafts = Object.values(S.T).filter((t) => t.draft);
  const text = S.report || drafts.map((t) => t.draft).join("\n");
  const docs = new Set(CORPUS.docs.map((d) => d.title));
  const reads = Object.values(S.T).flatMap((t) => t.visited.map((v) => v.doc));
  const readU = new Set(reads);
  const sents = sentencesOf(text);
  const cited = [...text.matchAll(/«([^»]+)»/g)].map((m) => m[1]);
  const backed = sents.filter((x) => [...x.matchAll(/«([^»]+)»/g)].some((m) => docs.has(m[1])));
  const counts = {}; cited.forEach((c) => counts[c] = (counts[c] || 0) + 1);
  const top = Object.entries(counts).sort((a, b) => b[1] - a[1])[0];
  return {
    source: S.report ? "가이드북" : drafts.length ? `엽서 ${drafts.length}장(가이드북 전)` : null,
    sents: sents.length, backed: backed.length, cited: cited.length,
    rate: sents.length ? backed.length / sents.length * 100 : 0,
    fake: [...new Set(cited.filter((c) => !readU.has(c)))],
    unused: [...readU].filter((d) => !counts[d]),
    skew: cited.length ? top[1] / cited.length * 100 : 0, skewDoc: top?.[0],
    dup: reads.length ? (1 - readU.size / reads.length) * 100 : 0, reads: reads.length, readU: readU.size,
  };
}
function scoreHtml(){

  const card = (cls, name, val, desc) => `<div class="metric ${cls}"><span class="n">${name}</span><span class="v">${val}</span><span class="d">${desc}</span></div>`;
  const rec = S.recorded ? `<div class="hint" style="margin:-2px 0 8px">graph.py 가 기록한 값(metrics.py): 경보 ${S.recorded.경보합} · 근거율 ${S.recorded.근거율}% · 중복 ${S.recorded.중복률}% · 편중 ${S.recorded.인용편중}% · 읽고 안 쓴 ${(S.recorded.읽고안쓴 || []).length}건</div>` : "";
  return rec + `<h3>📊 여행 결산 <small class="hint">— ${esc(m.source)} 기준 · 정답표도 판정 모델도 쓰지 않아요</small></h3>
  <div class="hint" style="margin-bottom:6px">🚨 경보 — 0이어야 해요</div>` +
  card(m.fake.length ? "alarm-bad" : "alarm-ok", "허위 인용", m.fake.length ? `🚨 ${m.fake.length}` : "✅ 0",
    `아무도 읽지 않은 문서를 인용했나. 0이 아니면 볼 것도 없이 탈락 → 리서처의 엽서 쓰기(WRITE).${m.fake.length ? `<br>«${esc(m.fake.join("», «"))}»` : ""}`) +
  `<div class="hint" style="margin:12px 0 6px">📈 신호 — 설정끼리 높낮이를 견줘요 (순위표 아님)</div>` +
  card("", "근거 비율", `${m.rate.toFixed(1)}%`, `문장 ${m.sents}개 중 «인용» 붙은 문장 ${m.backed}개. 낮으면 자료 없이 쓴 대목이 많다 → 도시 예산(절 예산)·취재 메모.`) +
  card("", "중복률", `${m.dup.toFixed(1)}%`, `취재 ${m.reads}번 중 서로 다른 도시 ${m.readU}곳. 높으면 여행자끼리 같은 도시를 겹쳐 갔다 → 🚩 피하기 목록(구역)·첫 도시 배정.`) +
  card("", "인용 편중", `${m.skew.toFixed(1)}%`, `인용 ${m.cited}곳 중 가장 많이 인용된 «${esc(m.skewDoc || "-")}»의 몫. 높으면 한 도시에 기대 썼다 → 배정·구역.`) +
  card("", "읽고 안 쓴 도시", `${m.unused.length}곳`, `다녀왔지만 엽서에 한 번도 안 나온 곳. 많으면 엉뚱한 첫 도시를 배정했거나 고르기가 빗나갔다 → 기획의 문서 카드.${m.unused.length ? `<br>«${esc(m.unused.join("», «"))}»` : ""}`) +
  `<div class="hint" style="margin-top:12px;line-height:1.6">✋ 인용이 엉뚱한 문장에 붙은 것(오귀속)은 어느 숫자도 못 잡아요. 📘 가이드북에서 «인용»을 눌러 원문과 직접 대조해 보세요.<br>문장 자르기 규칙: 마침표 뒤에 붙은 «인용»을 앞 문장으로 옮긴 뒤 자릅니다 (규칙이 바뀌면 근거 비율도 바뀌니 고정해 둡니다).</div>`;
}

    const e = JSON.parse(m.data); const wasEnd = D.idx === D.events.length - 1;
    D.events.push(e); if (e.kind === "dispatch") renderBps();
    if (D.follow && wasEnd && !D.playing) setIdx(D.events.length - 1, { instant: false }); else { drawTicks(); $("#scrub").max = D.events.length - 1; $("#caption .ix").textContent = `${D.idx + 1} / ${D.events.length}`; }
  };
  es.addEventListener("done", () => { es.close(); D.live = false; D.source = null; render(true); refreshRuns(id); $("#go").disabled = false; toast("🎉 여행이 끝났어요. 이제 ⏮ 로 처음부터 한 단계씩 돌려 볼 수 있어요."); });
  es.onerror = () => { if (D.live) toast("연결이 잠깐 끊겼어요. 다시 시도합니다…"); };
}
function resetView(){
  play(false); D.source?.close(); D.events = []; D.idx = -1; D.follow = true; D.selected = null;
  [...travelers.keys()].forEach(removeTraveler); clearPostcards(); bookTarget = 0.001;
}
$("#go").onclick = async () => {
  const body = { question: $("#fQuestion").value, sections: Number($("#fSections").value), budget: Number($("#fBudget").value),
    no_roles: $("#fNoRoles").checked, no_assign: $("#fNoAssign").checked, no_zones: $("#fNoZones").checked,
    replay: $("#fMode").value === "replay", pace: Number($("#fPace").value), incident: $("#fIncident").value === "" ? null : Number($("#fIncident").value) };
  const r = await fetch("/api/run", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const j = await r.json(); if (!r.ok) { toast(j.error || "출발하지 못했어요"); return; }
  resetView(); D.runId = j.id; $("#go").disabled = true; $("#planner").classList.remove("open");
  openStream(j.id); render(true);
};
$("#loadRun").onclick = async () => {
  const id = $("#fRuns").value; if (!id) return;
  resetView(); D.runId = id; D.live = false;
  D.events = await (await fetch(`data/events/${encodeURIComponent(id)}.json`)).json();
  renderBps(); setIdx(-1, { instant: true }); $("#planner").classList.remove("open");
  toast("⏪ 지난 여행을 불러왔어요. ▶ 재생하거나 → 로 한 단계씩 넘겨 보세요.");
};
$("#openPlanner").onclick = () => { $("#planner").classList.toggle("open"); refreshRuns(); };
function updatePlanWarn(){
  const st = D.status || {}, replay = $("#fMode").value === "replay" || !st.has_key;
  $("#fIncident").disabled = !replay;
  $("#fMode").querySelector('option[value="replay"]').disabled = !st.replay_ok;
  $("#planWarn").innerHTML = !st.has_key && !st.replay_ok
    ? `<div class="warn">🔑 이 자료(${esc(st.data_dir)})에는 저장된 기록이 없어요. .env 에 ${esc(st.key_name)} 를 넣어야 출발할 수 있어요. 지난 여행 다시보기는 됩니다.</div>`
    : replay ? `<div class="warn">🟢 저장된 기록 재생 모드예요. 작성 시점 질문(1894년)의 기록을 돌려주므로 질문·설정을 바꿔도 여정은 같아요.</div>`
    : `<div class="warn" style="background:rgba(255,107,107,.14);border-color:rgba(255,130,130,.5);color:#ffd6d6">🔴 실제 호출 — ${esc(st.model)} 를 부르고 요금이 나옵니다.</div>`;
  $("#go").disabled = (!st.has_key && !st.replay_ok) || !!D.live;
}
$("#fMode").onchange = updatePlanWarn;

/* ───────────────────────── 애니메이션 루프 ───────────────────────── */
const clock = new THREE.Clock();
let bookTarget = 0.001;
const camDir = new THREE.Vector3(), tmpN = new THREE.Vector3();
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05), time = clock.elapsedTime;
  travelers.forEach((t) => { stepFlight(t, dt); drawTrail(t); });
  postcards.forEach((p) => {
    if (p.t < 1) { p.t = Math.min(1, p.t + dt / p.dur); const e = 1 - Math.pow(1 - p.t, 3); p.mesh.position.lerpVectors(p.from, p.dest, e); p.mesh.position.y += Math.sin(Math.PI * e) * 3; }
    p.mesh.lookAt(camera.position);
  });
  const s = hqBook.scale.x + (bookTarget - hqBook.scale.x) * 0.08; hqBook.scale.setScalar(s); hqBook.rotation.y = time * 0.6;
  postcards.forEach((p) => p.mesh.material.opacity = S.report ? Math.max(0.15, 1 - (s - 0.001)) : 1);
  hqBeam.pivot.rotation.y = time * 0.9;
  clouds.forEach((c) => { const q = new THREE.Quaternion().setFromAxisAngle(c.axis, time * c.speed); c.g.position.copy(c.start).applyQuaternion(q).multiplyScalar(c.r); c.g.lookAt(0, 0, 0); });
  cities.forEach((c) => { if (c.beacon.material.opacity > 0) c.beacon.material.opacity = 0.25 + Math.sin(time * 4) * 0.12; if (c.ring.material.opacity > 0) c.ring.scale.setScalar(1 + Math.sin(time * 3) * 0.06); });
  // 지구 뒤편 라벨은 숨긴다
  camDir.copy(camera.position).normalize();
  cities.forEach((c) => { const vis = tmpN.copy(c.dir).dot(camDir) > 0.18; c.label.style.opacity = vis ? (c.label.classList.length > 1 ? 1 : 0.78) : 0; c.label.style.pointerEvents = vis ? "auto" : "none"; });
  travelers.forEach((t) => { tmpN.copy(t.g.position).normalize(); t.div.style.visibility = tmpN.dot(camDir) > -0.05 ? "visible" : "hidden"; });
  const cm = $("#cam").value; let focus = null;
  if (cm === "hq") focus = hq.position;
  else if (cm.startsWith("s")) focus = travelers.get(Number(cm.slice(1)))?.g.position;
  else if (cm === "auto") { const ev = D.events[D.idx]; focus = ev && ev.section != null ? travelers.get(ev.section)?.g.position : (ev ? hq.position : null); }
  if (focus) {
    const dist = camera.position.length(), want = focus.clone().normalize().add(new THREE.Vector3(0, 0.35, 0)).setLength(dist);
    camera.position.lerp(want, 0.035); controls.autoRotate = false;
  }
  controls.update(); renderer.render(scene, camera); labelRenderer.render(scene, camera);
}
addEventListener("resize", () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); labelRenderer.setSize(innerWidth, innerHeight); drawTicks(); });

/* ───────────────────────── 시작 ───────────────────────── */
(async function boot(){
  const corpus = await (await fetch("data/corpus.json")).json();
  const status = { has_key: false, replay_ok: true, default_mode: "replay", data_dir: "output/runs.jsonl", model: "저장된 기록", key_name: "",
    window_chars: corpus.window_chars, window_note: corpus.window_note, questions: [], default_question: "", running: null };
  D.status = status; CORPUS = corpus; buildCities();
  $("#brandSub").textContent = `${corpus.summary} · ${status.data_dir}`;
  $("#fQuestion").value = status.default_question;
  if (status.window_chars) { WINDOW_CHARS = status.window_chars; WINDOW_NOTE = status.window_note; }
  $("#fPreset").innerHTML = (status.questions || []).map((q, i) => `<option value="${i}">${esc(q.id)} · ${esc(q.유형)} — ${esc(q.질문.slice(0, 34))}${q.질문.length > 34 ? "…" : ""}</option>`).join("");
  const showWhy = () => { const q = status.questions?.[Number($("#fPreset").value)]; if (q) { $("#fQuestion").value = q.질문; $("#fWhy").textContent = `왜 나눌 만한가: ${q["왜 나눌 만한가"]}`; } };
  $("#fPreset").onchange = showWhy; showWhy();
  if (!status.has_key) $("#fMode").value = status.replay_ok ? "replay" : "auto";
  $("#fIncident").innerHTML = `<option value="">없음</option>` + Array.from({ length: 8 }, (_, i) => `<option value="${i}">🎒 여행자 ${i + 1}의 두 번째 취재를 결항</option>`).join("");
  updatePlanWarn(); renderBps(); render(true); refreshRuns(); animate();
  const savedRuns = await refreshRuns();
  // 주소로 장면 바로 열기: ?run=기록ID&at=단계&tab=event|vars|report|log&sel=여행자번호(1부터)
  const qs = new URLSearchParams(location.search);
  if (qs.get("run") && !status.running) {
    D.runId = qs.get("run");
    D.events = await (await fetch(`data/events/${encodeURIComponent(D.runId)}.json`)).json();
    renderBps();
    if (qs.get("tab")) document.querySelector(`.tab[data-tab="${qs.get("tab")}"]`)?.click();
    setIdx(qs.get("at") === "end" ? D.events.length - 1 : Number(qs.get("at") ?? -1), { instant: true });
    if (qs.get("sel")) selectTraveler(Number(qs.get("sel")) - 1);
  } else if (savedRuns.length) {          // 가장 최근 실행을 바로 불러와 둔다
    $("#fRuns").value = savedRuns[0].id; await $("#loadRun").onclick();
  }
})();
</script>
